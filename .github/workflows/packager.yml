name: Package

on:
  # Register the dispatch workflow when this file changes on the default branch.
  push:
    branches: [master]
    paths: ['.github/workflows/packager.yml']
  workflow_dispatch:
    inputs:
      tag_name:
        description: "The tag to package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    if: github.event_name == 'workflow_dispatch'
    uses: Xerrion/wow-workflows/.github/workflows/packager.yml@main
    with:
      tag_name: ${{ inputs.tag_name }}
    secrets: inherit
